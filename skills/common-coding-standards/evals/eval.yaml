schema_version: v1alpha1

environment:
  type: none

skills:
  - source: local_path
    path: .
    include:
      - SKILL.md
      - references/**

engine:
  name: claude_code
  model:
    name: haiku

cases:
  files:
    - evals/cases/production-service-boundaries.yaml
  defaults:
    timeout_seconds: 90
    max_turns: 3
  parallelism: 1

benchmark:
  enabled: false

judge:
  type: rule_based
  success:
    - output_matches:
        any: ["命令行|--port|CLI"]
    - output_matches:
        any: ["健康检查|探活|/healthz|/readyz"]
    - output_matches:
        any: ["用户配置.*内部(配置|默认)", "内部(配置|默认).*用户配置", "缓存参数.*用户配置.*分离", "端口.*缓存参数.*分离"]
    - output_matches:
        any: ["可写目录|可配置.*目录|可配置.*路径|可配置.*卷|持久卷|数据目录.*可配|显式可配.*目录"]
    - output_contains:
        all: ["升级", "回滚", "离线"]

report:
  formats: [json, html]
  artifacts: [transcript]
