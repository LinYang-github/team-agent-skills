id: domain-use-case
title: 由领域服务组装已有事实的业务入口
description: 验证技能能否减少调用方重抄已有结果，并保持输入范围、证据和合理底层接口。

input:
  prompt: |
    请使用 $domain-package-transformation 审查一个已有业务产品的能力拆分。系统已经保存各阶段结果、原始数据精度、元数据及输入版本。现有页面生成最终方案时读取所有结果，把显示表格拼成大型请求再提交；新增 AI 工具准备照搬这个过程，要求模型重写全部结果，并允许生成说明覆盖来源证据。一个任务包含多个指标和不同流程依赖，部分阶段不适用于当前流程。产品同时需要保留给外部调用方使用的独立算法入口。

    请设计生成方案这一领域用例的职责和契约，说明调用方提供什么、服务读取什么、如何限定输入范围、保留事实与证据以及拒绝过期预览。不要生成具体业务方案，也不要把所有工具合成一个流程工具或删除独立算法入口。

    若工具列表中存在团队 Skill，必须先加载；加载 Skill 是本用例唯一允许的工具调用。若不存在团队 Skill，则直接作答。不要读取或修改工作区，也不要调用其他工具。控制在 1000 字以内。

constraints:
  timeout_seconds: 120
  max_turns: 3

expect:
  exit_code: 0

judge:
  type: rule_based
  success:
    - output_matches:
        any: ["领域服务|服务端.*(?:读取|组装)|服务.*用例"]
    - output_matches:
        any: ["资源引用|资源.*ID|稳定.*引用"]
    - output_matches:
        any: ["指标.*(?:范围|作用域)|声明.*依赖|流程.*依赖"]
    - output_matches:
        any: ["精度|元数据"]
    - output_matches:
        any: ["说明.*(?:单独|分开|不.*覆盖)|事实.*说明.*分|不能.*(?:替换|覆盖).*证据"]
    - output_matches:
        any: ["预览.*(?:失效|过期|拒绝)|输入.*变化|版本.*变化"]
    - output_matches:
        any: ["保留.*(?:独立算法|底层接口)|独立算法.*保留"]
