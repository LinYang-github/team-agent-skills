id: project-layering
title: Web 项目应正确分层，区分 DTO/VO，DAO 不直接暴露给前端
description: |
  阿里规约：应用分层 Web/Service/Manager/DAO，跨层交互用 DTO/VO 而非直接返回 DO。
input:
  prompt: |
    这是非交互评测：不要提问或等待确认，信息不足时采用最小合理假设并直接完成答案。除本 Skill 按需参考外，不读取项目仓库、不运行命令。
    设计一个用户管理的 REST 模块，包含：
    - 用户查询接口 GET /users/{id}
    - 用户创建接口 POST /users

    给出精简代码骨架（Controller、Service、相关 DTO/VO、DAO/Mapper），可省略 getter/setter 和样板实现。
    重点关注分层和数据对象设计。
expect:
  must_contain:
    - "Controller"
judge:
  type: rule_based
  success:
    - output_contains:
        all: ["Controller", "Service"]
    - output_contains:
        any: ["DTO", "VO", "UserRequest", "UserResponse", "UserResp",
              "CreateUserRequest", "UserDTO", "UserVO"]
    - output_contains:
        any: ["@Service", "interface UserService", "class UserService", "UserService"]
